<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Forms-Practice</title>
    </head>
    <body>
        <h1>Forms Practice</h1>
        <form method="post">
            <p>
                <label for="your-name">Your name:</label>
                <input type="text" id="your-name" name="your-name" placeholder="Enter your name" required>
            </p>
            <p>
                <label for="your-email">Your email:</label>
                <input type="email" id="your-email" name="your-email" placeholder="Enter your email" required>
            </p>
            <p>
                <label for="study-hours">How many hours do you study per day?</label>
                <input type="number" id="study-hours" name="study-hours" min="1" max="8">
            </p>
            <p>
                <label for="pw">Password:</label>
                <input type="password" id="pw" name="pw" placeholder="Enter your password" required>
            </p>
            <p>
                <label for="message">Enter your message:</label>
                <textarea id="message" name="message" rows="4" cols="30"></textarea>
            </p>
            <fieldset>
                <legend>How should I answer?</legend>
                <p>
                    <input type="radio" id="by-email" name="answer" value="email">
                    <label for="by-email">By email</label>
                </p>
                <p>
                    <input type="radio" id="by-telegram" name="answer" value="telegram">
                    <label for="by-telegram">By telegram</label>
                </p>
            </fieldset>
            <p>
                <label for="level">Your level:</label>
                <select id="level" name="level">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </p>
            <p>
                <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label for="subscribe">Subscribe to our newsletter</label>
            </p>
            <p>
                <button type="submit">Send</button>
            </p>
        </form>
    </body>
</html>
