<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tables practice</title>
    </head>
    <body>
        <h1>Table Practice</h1>
        <table>
            <caption>My learning plan</caption>
            <thead>
                <tr>
                    <th>Technology</th>
                    <th>Phase</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>HTML</td>
                    <td>1</td>
                    <td>Learning</td>
                </tr>
                <tr>
                    <td>CSS</td>
                    <td>2</td>
                    <td>Next</td>
                </tr>
                <tr>
                    <td>JavaScript</td>
                    <td>3</td>
                    <td>Later</td>
                </tr>
                <tr>
                    <td colspan="3">More technologies are coming soon.</td>
                </tr>
            </tbody>
        </table>
        <h2>Café ☕</h2>
    </body>
</html>
